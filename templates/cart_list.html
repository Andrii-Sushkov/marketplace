{% extends "base.html" %}

{% block content %}
    {% for item in cart %}
        <h1>Кошик</h1>
            
        {{cart.created_at}}
        {{item.ad}}
        {{item.quantity}}
        <a class="btn btn-danger" href="{% url 'cart_delete' item.pk %}">Видалити</a>
    {% empty %}
        <p>Кошик порожній</p>
    {% endfor %}
    
    <a class="btn btn-primary" href="{% url 'ad_list' %}">Назад</a>
{% endblock %}
