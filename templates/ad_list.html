{% extends "base.html" %}

{% block content %}
    <a class="btn btn-primary" href="{% url 'create_ad' %}">Додати новину</a>

    <div class="card" style="width: 18rem;">
        {% for ad in ads %}
            <a class="card-title, btn btn-primary" href="{% url 'ad_details' ad.pk %}">{{ad.title}}</a>
            <img class="card-img-top" src="{{ ad.image.url }}" alt="{{ ad.title }}" width="200">
        {% endfor %}
    </div>
{% endblock %}
